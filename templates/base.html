<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#09090b">
<title>{{ title }}</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap');

:root {
    --bg: #09090b;
    --surface: #131316;
    --surface2: #1a1a1f;
    --surface3: #222228;
    --border: rgba(255,255,255,.06);
    --border-hover: rgba(255,255,255,.12);
    --text: #ececef;
    --text2: #71717a;
    --accent: #8b5cf6;
    --accent-glow: rgba(139,92,246,.15);
    --accent2: #34d399;
    --accent2-glow: rgba(52,211,153,.15);
    --danger: #f43f5e;
    --warning: #f59e0b;
    --radius: 14px;
    --radius-sm: 10px;
    --transition: .2s cubic-bezier(.4,0,.2,1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

/* ── Scrollbar ───────────────── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 99px; }
::-webkit-scrollbar-thumb:hover { background: var(--text2); }

body {
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: hidden;
    line-height: 1.6;
}

a { color: var(--accent); text-decoration: none; transition: color var(--transition); }
a:hover { color: #a78bfa; }

.container {
    max-width: 540px;
    margin: 0 auto;
    padding: 0 20px 100px 20px;
}

/* ── Fixed review action bar ── */
.review-action-bar {
    position: fixed;
    bottom: 0;
    left: 0; right: 0;
    z-index: 110;
    background: rgba(9,9,11,.92);
    backdrop-filter: blur(24px) saturate(1.4);
    -webkit-backdrop-filter: blur(24px) saturate(1.4);
    border-top: 1px solid var(--border);
    padding: 12px 16px max(12px, env(safe-area-inset-bottom));
}
.review-action-bar .action-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    max-width: 540px;
    margin: 0 auto;
}
.review-action-bar .btn { font-size: 1rem; padding: 16px 12px; }

body.review-mode .bottomnav { display: none; }
body.review-mode .container { padding-bottom: 120px; }

/* ── Bottom nav ──────────────── */
.bottomnav {
    position: fixed;
    bottom: 0;
    left: 0; right: 0;
    z-index: 100;
    background: rgba(9,9,11,.88);
    backdrop-filter: blur(24px) saturate(1.4);
    -webkit-backdrop-filter: blur(24px) saturate(1.4);
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-around;
    padding: 6px 0 max(6px, env(safe-area-inset-bottom));
}
.bottomnav a {
    flex: 1 1 0;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    color: var(--text2);
    font-size: 0.65rem;
    font-weight: 500;
    padding: 8px 4px;
    border-radius: 12px;
    transition: all var(--transition);
    position: relative;
    white-space: nowrap;
}
.bottomnav a.active {
    color: var(--accent);
}
.bottomnav a.active::after {
    content: '';
    position: absolute;
    top: 2px;
    left: 50%;
    transform: translateX(-50%);
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
}
.bottomnav a:hover {
    color: var(--text);
    background: rgba(255,255,255,.04);
}
.bottomnav a svg { width: 20px; height: 20px; stroke-width: 1.8; }

/* ── Cards / Surfaces ────────── */
.card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 16px;
    transition: all var(--transition);
    position: relative;
}
.card:hover {
    border-color: var(--border-hover);
}
.card:active { transform: scale(0.985); }

.card-content {
    font-size: 1.2rem;
    line-height: 1.6;
    font-weight: 500;
    text-align: center;
    padding: 20px 0;
}
/* Keeps typed line breaks visible on the card (single-line text is unaffected) */
.card-text { white-space: pre-wrap; }
.card-content img {
    max-width: 100%;
    max-height: 50vh;
    object-fit: contain;
    border-radius: var(--radius-sm);
}

/* ── Buttons ─────────────────── */
.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px 24px;
    border-radius: 99px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    border: none;
    cursor: pointer;
    transition: all var(--transition);
    text-decoration: none;
    width: 100%;
    letter-spacing: -0.01em;
}
.btn:active { transform: scale(0.97); }
.btn-primary {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 0 0 0 var(--accent-glow);
}
.btn-primary:hover {
    background: #7c3aed;
    box-shadow: 0 4px 24px var(--accent-glow);
}
.btn-success {
    background: var(--accent2);
    color: #fff;
    box-shadow: 0 0 0 0 var(--accent2-glow);
}
.btn-success:hover {
    background: #2bb583;
    box-shadow: 0 4px 24px var(--accent2-glow);
}
.btn-danger {
    background: var(--danger);
    color: #fff;
}
.btn-danger:hover { background: #e11d48; }
.btn-ghost {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
}
.btn-ghost:hover {
    background: var(--surface2);
    border-color: var(--border-hover);
}
.btn-sm { padding: 8px 16px; font-size: 0.82rem; }

.btn-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    margin: 16px 0;
}
.btn-row-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin: 16px 0;
}

/* ── Progress ────────────────── */
.progress-wrap {
    background: var(--surface2);
    border-radius: 99px;
    height: 4px;
    margin: 16px 0 8px;
    overflow: hidden;
}
.progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 99px;
    transition: width .4s ease;
    box-shadow: 0 0 12px var(--accent-glow);
}
.progress-label {
    font-size: 0.75rem;
    color: var(--text2);
    text-align: center;
    font-family: 'Space Mono', monospace;
}

/* ── Badges / chips ──────────── */
.badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 10px;
    border-radius: 99px;
    font-size: 0.7rem;
    font-weight: 600;
    font-family: 'Space Mono', monospace;
    letter-spacing: 0.02em;
}
.badge-accent { background: var(--accent-glow); color: var(--accent); }
.badge-green { background: var(--accent2-glow); color: var(--accent2); }
.badge-warning { background: rgba(245,158,11,.12); color: var(--warning); }
.badge-danger { background: rgba(244,63,94,.12); color: var(--danger); }

/* Pastille « Boîte n » : sa couleur suit la boîte Leitner de la carte, du rouge
   (fragile) au vert (acquis). Les deux tons sont calculés par le filtre
   box_style (voir app2.py) et posés en ligne par le gabarit ; toutes les boîtes
   visent la même luminance perçue, pour qu'aucune ne ressorte comme une tache
   claire au milieu du parcours. */
.badge-box {
    background: var(--box-chip, var(--surface3));
    color: var(--box-ink, var(--text));
}

/* ── Stats grid ──────────────── */
.stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    margin-bottom: 20px;
}
.stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 16px 10px;
    text-align: center;
    transition: border-color var(--transition);
}
.stat-card:hover { border-color: var(--border-hover); }
.stat-value {
    font-family: 'Space Mono', monospace;
    font-size: 1.3rem;
    font-weight: 600;
    color: var(--accent);
}
.stat-label {
    font-size: 0.65rem;
    color: var(--text2);
    margin-top: 4px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    font-weight: 500;
}

/* ── Chart ────────────────────── */
.chart-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
}
.chart-card h3 {
    font-size: 0.8rem;
    color: var(--text2);
    margin-bottom: 12px;
    font-weight: 500;
    letter-spacing: 0.01em;
}

/* ── Forms ────────────────────── */
.form-group { margin-bottom: 18px; }
.form-group label {
    display: block;
    font-size: 0.72rem;
    color: var(--text2);
    margin-bottom: 6px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.8px;
}
.form-group input[type="text"],
.form-group input[type="number"],
.form-group input[type="password"],
.form-group textarea,
.form-group select {
    width: 100%;
    padding: 11px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    outline: none;
    transition: all var(--transition);
}
.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
}
.form-group textarea { min-height: 80px; resize: vertical; }
/* Face en image : son texte ne compte plus, le champ passe en retrait */
.form-group textarea.is-locked {
    opacity: 0.5;
    cursor: not-allowed;
    border-style: dashed;
    background: transparent;
}
.form-group textarea.is-locked:focus {
    border-color: var(--border);
    box-shadow: none;
}
.form-group input[type="file"] {
    width: 100%;
    max-width: 100%;
    overflow: hidden;
    color: var(--text2);
    font-size: 0.82rem;
}
.form-group input[type="file"]::file-selector-button {
    margin-right: 10px;
    padding: 7px 12px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.78rem;
    font-weight: 500;
    cursor: pointer;
    transition: all var(--transition);
}
.form-group input[type="file"]::file-selector-button:hover {
    background: var(--surface3);
    border-color: var(--border-hover);
}

/* Compact file pickers — always two per row, even on a narrow phone */
.upload-row {
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
}
.upload-slot {
    position: relative;
    flex: 1 1 0;
    min-width: 0;
}
.upload-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 11px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text2);
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    transition: all var(--transition);
}
.upload-btn:hover { border-color: var(--border-hover); color: var(--text); }
.upload-btn .ico { flex-shrink: 0; line-height: 1; }
.upload-btn .txt {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
/* Kept focusable (not display:none) so the keyboard can still reach it */
.upload-btn input[type="file"] {
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;
}
.upload-slot:focus-within .upload-btn {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
}
.upload-slot.has-file .upload-btn {
    padding-right: 32px;
    background: var(--accent2-glow);
    border-color: var(--accent2);
    color: var(--text);
}
.upload-clear {
    display: none;
    position: absolute;
    top: 50%;
    right: 6px;
    transform: translateY(-50%);
    width: 22px;
    height: 22px;
    padding: 0;
    background: none;
    border: none;
    border-radius: 50%;
    color: var(--text2);
    font-size: 0.75rem;
    line-height: 1;
    cursor: pointer;
    transition: all var(--transition);
}
.upload-slot.has-file .upload-clear { display: block; }
.upload-clear:hover { background: rgba(255,255,255,.08); color: var(--danger); }

/* Emoji prefixes — one tap marks both faces at once */
.emoji-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
}
.emoji-field .emoji-row { margin-top: 0; }
/* Deux faces en image : plus rien à préfixer */
.emoji-row.is-locked { opacity: 0.35; pointer-events: none; }
.emoji-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 5px 9px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 99px;
    color: var(--text2);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.88rem;
    line-height: 1.1;
    cursor: pointer;
    transition: all var(--transition);
}
.emoji-chip .lbl {
    font-size: 0.64rem;
    font-weight: 600;
    letter-spacing: 0.6px;
    text-transform: uppercase;
}
.emoji-chip .sep { font-size: 0.62rem; color: var(--text2); }
.emoji-chip:hover { border-color: var(--border-hover); color: var(--text); }
.emoji-chip.active {
    background: var(--accent-glow);
    border-color: var(--accent);
    color: var(--text);
}
/* Marqueur posé sur une seule des deux faces (carte d'avant, ou texte retouché) */
.emoji-chip.partial {
    border-style: dashed;
    border-color: var(--accent);
    color: var(--text);
}

/* Recto / verso panels — colour-codes which face you are filling in */
.face-panel {
    padding: 16px 16px 0;
    margin-bottom: 18px;
    border: 1px solid var(--border);
    border-left: 3px solid;
    border-radius: var(--radius);
}
.face-panel .section-title { margin: 0 0 14px; }
.face-recto {
    background: rgba(139,92,246,.06);
    border-left-color: var(--accent);
}
.face-recto .section-title { color: var(--accent); }
.face-verso {
    background: rgba(52,211,153,.06);
    border-left-color: var(--accent2);
}
.face-verso .section-title { color: var(--accent2); }

/* ── Flash messages ──────────── */
.flash {
    padding: 12px 16px;
    border-radius: var(--radius-sm);
    margin-bottom: 16px;
    font-size: 0.88rem;
    font-weight: 500;
    animation: slideDown .35s cubic-bezier(.4,0,.2,1);
    border-left: 3px solid;
}
.flash-success { background: rgba(52,211,153,.08); color: var(--accent2); border-left-color: var(--accent2); }
.flash-error { background: rgba(244,63,94,.08); color: var(--danger); border-left-color: var(--danger); }
.flash-info { background: var(--accent-glow); color: var(--accent); border-left-color: var(--accent); }

@keyframes slideDown {
    from { opacity:0; transform:translateY(-8px); }
    to { opacity:1; transform:translateY(0); }
}

/* ── Box list ────────────────── */
.box-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(68px, 1fr));
    gap: 8px;
}
.box-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 12px 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    text-decoration: none;
    transition: all var(--transition);
}
.box-item:hover, .box-item.active {
    border-color: var(--accent);
    background: var(--accent-glow);
    box-shadow: 0 0 16px var(--accent-glow);
}
.box-num { font-family:'JetBrains Mono',monospace; font-weight:600; font-size:1.05rem; color:var(--accent); }
.box-count { font-size:0.65rem; color:var(--text2); margin-top:2px; }

/* ── Card list items ─────────── */
.card-list-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    margin-bottom: 8px;
    text-decoration: none;
    color: var(--text);
    transition: all var(--transition);
}
.card-list-item:hover {
    border-color: var(--border-hover);
    background: var(--surface2);
}
.card-list-item .preview {
    flex: 1;
    font-size: 0.88rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.card-list-item .marked-icon { color: var(--warning); }
.card-list-item img.thumb {
    width: 42px;
    height: 42px;
    object-fit: cover;
    border-radius: 8px;
    flex-shrink: 0;
}

/* ── Misc ────────────────────── */
.section-title {
    font-size: 0.7rem;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 1.2px;
    margin: 28px 0 12px;
    font-weight: 600;
}
.empty-state {
    text-align: center;
    padding: 56px 20px;
    color: var(--text2);
}
.empty-state .icon { font-size: 2.8rem; margin-bottom: 14px; opacity: .7; }

.meta-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 12px 0;
}

.detail-face {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 20px;
    margin-bottom: 12px;
    text-align: center;
}
.detail-face h4 {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--text2);
    margin-bottom: 12px;
    font-weight: 600;
}
.detail-face img { max-width:100%; max-height:40vh; object-fit:contain; border-radius:8px; }

/* ── Login ────────────────────── */
.login-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    padding: 20px;
    background: radial-gradient(ellipse at 50% 0%, rgba(139,92,246,.06) 0%, transparent 60%);
}
.login-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 44px 36px;
    width: 100%;
    max-width: 380px;
    text-align: center;
    box-shadow: 0 24px 64px rgba(0,0,0,.4);
}
.login-box h1 {
    font-family: 'Space Mono', monospace;
    font-size: 1.3rem;
    font-weight: 600;
    margin-bottom: 6px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}
.login-box p { color: var(--text2); font-size: 0.88rem; margin-bottom: 28px; }

/* ── Review done ─────────────── */
.done-wrap {
    text-align: center;
    padding: 60px 20px;
}
.done-wrap .emoji { font-size: 3.5rem; margin-bottom: 16px; }
.done-wrap h2 { margin-bottom: 8px; font-weight: 600; }
.done-wrap p { color: var(--text2); margin-bottom: 24px; }

/* ── Confirm dialog ──────────── */
.confirm-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.7);
    backdrop-filter: blur(8px);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 20px;
}
.confirm-overlay.show { display: flex; }
.confirm-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px 24px;
    max-width: 340px;
    width: 100%;
    text-align: center;
    box-shadow: 0 24px 64px rgba(0,0,0,.5);
    animation: scaleIn .2s cubic-bezier(.4,0,.2,1);
}
.confirm-box p { margin-bottom: 20px; font-size: 0.92rem; }

@keyframes scaleIn {
    from { opacity:0; transform:scale(.95); }
    to { opacity:1; transform:scale(1); }
}

/* ── Minuteur de session (révision) : discret et moderne ──────────────────── */
.session-timer {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px 4px 8px;
    border: none;
    border-radius: 99px;
    background: rgba(255,255,255,.035);
    color: var(--text2);
    cursor: pointer;
    font-family: 'Space Mono', monospace;
    font-size: .68rem;
    letter-spacing: .04em;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    white-space: nowrap;
    user-select: none;
    opacity: .7;
    transition: all var(--transition);
}
.session-timer:hover {
    opacity: 1;
    color: var(--text);
    background: var(--surface2);
}
.session-timer::before {
    content: '';
    width: 5px;
    height: 5px;
    border-radius: 50%;
    flex-shrink: 0;
    background: var(--accent2);
    animation: timerPulse 2.4s ease-in-out infinite;
}
@keyframes timerPulse {
    0%, 100% { opacity: .3;  transform: scale(.8); }
    50%      { opacity: 1;   transform: scale(1); }
}
@media (prefers-reduced-motion: reduce) {
    .session-timer::before { animation: none; opacity: .75; }
}
/* En pause : le point qui pulse devient une icône « pause » ambre (deux barres,
   la seconde dessinée par le box-shadow), et les chiffres se figent. */
.session-timer.is-paused {
    color: var(--warning);
    opacity: .85;
}
.session-timer.is-paused::before {
    animation: none;
    width: 3px;
    height: 8px;
    border-radius: 1px;
    margin-right: 5px;          /* place pour la 2e barre du box-shadow */
    background: var(--warning);
    box-shadow: 5px 0 0 var(--warning);
}

/* ── Selection ───────────────── */
::selection {
    background: var(--accent-glow);
    color: var(--text);
}
</style>
</head>
<body class="{{ body_class }}">
{% block body %}
<div class="container" style="padding-top:max(20px, env(safe-area-inset-top));">
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        {% for category, message in messages %}
        <div class="flash flash-{{ category }}">{{ message }}</div>
        {% endfor %}
    {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
</div>

<nav class="bottomnav">
    <a href="/" class="{% if active == 'review' %}active{% endif %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg><span>Réviser</span>
    </a>
    <a href="/manage" class="{% if active == 'manage' %}active{% endif %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg><span>Gérer</span>
    </a>
    <a href="/create" class="{% if active == 'create' %}active{% endif %}">

    </a>

    </a>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22C6.477 22 2 17.523 2 12S6.477 2 12 2s10 4.477 10 10"/><polyline points="12 6 12 12 16 14"/><path d="M22 12a10 10 0 0 1-10 10"/></svg><span>Backups</span>
    </a>

    </a>
</nav>
{% endblock %}

<script>
/* ── Minuteur de session ─────────────────────────────────────────────────────
   Repart de l'écoulé fourni par le serveur : il survit donc aux rechargements
   de page entre deux cartes / fournées, pauses comprises.
   Un clic sur le minuteur met en pause ; toucher une carte relance. ───────── */
(function () {
    var els = document.querySelectorAll('.session-timer[data-elapsed]');
    if (!els.length) return;

    var mode   = els[0].dataset.mode || 'focus';
    var base   = parseInt(els[0].dataset.elapsed, 10) || 0;   // secondes déjà comptées
    var paused = els[0].dataset.paused === '1';
    var t0     = Date.now();                                  // repère de la portion en cours
    var pad    = function (n) { return String(n).padStart(2, '0'); };

    function render() {
        var s = paused ? base : base + Math.floor((Date.now() - t0) / 1000);
        var h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, sec = s % 60;
        var txt = (h ? h + ':' + pad(m) : pad(m)) + ':' + pad(sec);
        var tip = paused ? 'Minuteur en pause — cliquer pour reprendre'
                         : 'Durée de la session — cliquer pour mettre en pause';
        els.forEach(function (el) {
            el.textContent = txt;
            el.classList.toggle('is-paused', paused);
            el.title = tip;
            el.setAttribute('aria-label', tip);
        });
    }

    function setPaused(next) {
        if (next === paused) return;
        if (next) base = base + Math.floor((Date.now() - t0) / 1000);  // fige la valeur
        else      t0 = Date.now();                                     // repart de la valeur figée
        paused = next;
        render();
        /* keepalive : la requête aboutit même si un clic sur une carte
           déclenche aussitôt une navigation. */
        try {
            fetch('/review/timer/' + mode + '/' + (next ? 'pause' : 'resume'),
                  { method: 'POST', keepalive: true }).catch(function () {});
        } catch (e) {}
    }

    /* Reprise programmée depuis les pages de révision (clavier, swipe, notation) */
    window.reviewTimerResume = function () { setPaused(false); };

    els.forEach(function (el) {
        el.addEventListener('click', function (e) {
            e.preventDefault();
            e.stopPropagation();
            setPaused(!paused);
        });
    });

    /* Reprise automatique au premier contact avec une carte ou la barre d'action */
    document.addEventListener('pointerdown', function (e) {
        if (!paused || !e.target || !e.target.closest) return;
        if (e.target.closest('.session-timer')) return;      // le minuteur garde son propre clic
        if (e.target.closest('#swipeCard, .gcards, .review-action-bar')) setPaused(false);
    }, true);

    render();
    setInterval(render, 1000);
})();

/* ── Une face en image n'a pas de texte : son champ passe en lecture seule ────
   Le serveur ignore le texte d'une face qui reçoit une image (création) ou
   l'efface (modification) : le formulaire le montre au lieu de laisser saisir
   dans le vide. Lecture seule et non désactivé, pour que la valeur continue
   d'être postée — un champ désactivé serait lu comme vide, donc effacé. ───── */
(function () {
    ['recto', 'verso'].forEach(function (face) {
        var ta = document.querySelector('textarea[name="' + face + '_text"]');
        if (!ta) return;
        var upload = document.querySelector('input[type="file"][name="' + face + '_upload"]');
        var url = document.querySelector('input[name="' + face + '_url"]');
        var remove = document.querySelector('input[name="' + face + '_remove_image"]');
        var stored = ta.dataset.image || '';          // 'local', 'remote', ou aucune image
        var placeholder = ta.placeholder;

        /* Même arbitrage que _resolve_face_image() côté serveur, dans cet ordre. */
        function hasImage() {
            if (upload && upload.files && upload.files.length) return true;
            if (remove && remove.checked) return false;
            if (url && url.value.trim()) return true;
            if (stored === 'remote') return false;    // champ URL vidé = image retirée
            return stored === 'local';
        }

        function refresh() {
            var locked = hasImage();
            ta.readOnly = locked;
            ta.classList.toggle('is-locked', locked);
            ta.placeholder = locked ? "L'image de cette face remplace son texte" : placeholder;
            /* Les pastilles emoji écoutent : elles ne préfixent pas une face verrouillée. */
            ta.dispatchEvent(new CustomEvent('facelock', { bubbles: true }));
        }

        [upload, url, remove].forEach(function (el) {
            if (!el) return;
            el.addEventListener('change', refresh);
            el.addEventListener('input', refresh);
        });
        refresh();
    });
})();

/* ── Majuscule initiale : "🇬🇧 dog" devient "🇬🇧 Dog" ─────────────────────────
   Même règle que capitalize_first() dans app2.py, appliquée en quittant le
   champ pour qu'elle se voie avant la sauvegarde : on saute l'emoji et les
   espaces, on laisse tranquille un texte qui commence par un chiffre et un mot
   du genre « iPhone ». ────────────────────────────────────────────────────── */
(function () {
    function capitalizeFirst(text) {
        for (var i = 0; i < text.length; i++) {
            var char = text[i];
            if (char >= '0' && char <= '9') return text;
            /* Ni majuscule ni minuscule : emoji, espace, ponctuation — on passe. */
            if (char.toLowerCase() === char.toUpperCase()) continue;
            var next = text[i + 1] || '';
            var nextIsUpper = next.toLowerCase() !== next.toUpperCase() && next === next.toUpperCase();
            if (char === char.toLowerCase() && !nextIsUpper) {
                return text.slice(0, i) + char.toLocaleUpperCase() + text.slice(i + 1);
            }
            return text;
        }
        return text;
    }

    ['recto_text', 'verso_text'].forEach(function (name) {
        var ta = document.querySelector('textarea[name="' + name + '"]');
        if (!ta) return;
        ta.addEventListener('blur', function () {
            if (ta.readOnly) return;
            var fixed = capitalizeFirst(ta.value);
            if (fixed === ta.value) return;
            var caret = ta.selectionStart;
            ta.value = fixed;                        // longueur inchangée : le curseur reste en place
            ta.setSelectionRange(caret, caret);
            ta.dispatchEvent(new Event('input', { bubbles: true }));
        });
    });
})();

/* ── Préfixes emoji : un clic pose (ou retire) le marqueur sur les DEUX faces ──
   Une pastille porte un emoji par face. Identiques (📖 des deux côtés) : elle
   bascule posé / retiré. Distincts (🇬🇧 → 🇫🇷) : elle a un sens, et les clics
   font le tour — 🇬🇧/🇫🇷, puis 🇫🇷/🇬🇧, puis rien. Cliquer une autre pastille
   remplace le marqueur en place. ──────────────────────────────────────────── */
(function () {
    document.querySelectorAll('.emoji-row[data-recto-target]').forEach(function (row) {
        var faces = ['recto', 'verso'].map(function (face) {
            return document.querySelector('textarea[name="' + row.dataset[face + 'Target'] + '"]');
        });
        if (!faces[0] || !faces[1]) return;

        var palette = [];   // tous les marqueurs : ceux qu'un clic doit savoir retirer
        var items = Array.prototype.map.call(row.querySelectorAll('.emoji-chip'), function (chip) {
            var recto = chip.dataset.recto, verso = chip.dataset.verso;
            [recto, verso].forEach(function (emoji) {
                if (palette.indexOf(emoji) === -1) palette.push(emoji);
            });
            return {
                chip: chip,
                emos: chip.querySelectorAll('.emo'),
                /* Deux emojis distincts → les deux sens sont proposés tour à tour. */
                states: recto === verso ? [[recto, verso]] : [[recto, verso], [verso, recto]],
                next: 0
            };
        });

        /* Sépare "🇬🇧 texte" en son préfixe et le reste. */
        function split(ta) {
            for (var i = 0; i < palette.length; i++) {
                if (ta.value.indexOf(palette[i]) === 0) {
                    return { prefix: palette[i], rest: ta.value.slice(palette[i].length).replace(/^[ \t]+/, '') };
                }
            }
            return { prefix: '', rest: ta.value };
        }

        /* Réécrit le préfixe d'une face ; '' l'enlève. Le texte ne bouge qu'en
           tête, donc on décale le curseur d'autant. Une face en image n'a pas
           de texte à marquer : on la laisse tranquille. */
        function setPrefix(ta, emoji) {
            if (ta.readOnly) return;
            var before = ta.value.length;
            var caret = ta.selectionStart;
            var rest = split(ta).rest;
            ta.value = emoji ? emoji + ' ' + rest : rest;
            var pos = Math.min(Math.max(caret + ta.value.length - before, 0), ta.value.length);
            ta.setSelectionRange(pos, pos);
        }

        function refresh() {
            var cur = faces.map(function (ta) { return split(ta).prefix; });
            /* Seules les faces sans image comptent : une carte image/texte est
               marquée dès que son unique face de texte porte le marqueur. */
            var live = [0, 1].filter(function (i) { return !faces[i].readOnly; });
            row.classList.toggle('is-locked', live.length === 0);
            items.forEach(function (item) {
                var full = -1, half = -1;
                item.states.forEach(function (state, i) {
                    var hits = live.filter(function (f) { return cur[f] === state[f]; }).length;
                    if (live.length && hits === live.length) { if (full < 0) full = i; }
                    else if (hits > 0 && half < 0) half = i;
                });
                item.chip.classList.toggle('active', full >= 0);
                item.chip.classList.toggle('partial', full < 0 && half >= 0);
                /* Posé : le clic suivant avance dans le tour. Posé à moitié : il
                   complète le sens déjà là. Absent : il pose le premier sens. */
                var shown = full >= 0 ? full : (half >= 0 ? half : 0);
                item.next = full >= 0 ? full + 1 : shown;
                /* La pastille montre le sens en place, pas celui de la palette. */
                if (item.emos.length === 2) {
                    item.emos[0].textContent = item.states[shown][0];
                    item.emos[1].textContent = item.states[shown][1];
                }
            });
        }

        /* On rend la main au champ que l'utilisateur éditait, pas à la pastille. */
        var lastFocused = null;
        faces.forEach(function (ta) {
            ta.addEventListener('focus', function () { lastFocused = ta; });
            ta.addEventListener('input', refresh);
            ta.addEventListener('facelock', refresh);   // une image vient d'arriver / partir
        });

        items.forEach(function (item) {
            item.chip.addEventListener('click', function () {
                var state = item.next < item.states.length ? item.states[item.next] : ['', ''];
                setPrefix(faces[0], state[0]);
                setPrefix(faces[1], state[1]);
                refresh();
                var back = lastFocused && !lastFocused.readOnly ? lastFocused
                         : (faces[0].readOnly ? faces[1] : faces[0]);
                if (!back.readOnly) back.focus();
            });
        });

        refresh();
    });
})();
</script>
</body>
</html>
